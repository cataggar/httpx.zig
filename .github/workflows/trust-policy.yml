name: Native trust policy

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .gitattributes
      - src/tls/**/*
      - build.zig
      - .github/workflows/trust-policy.yml

permissions:
  contents: read
  attestations: read

jobs:
  trust:
    name: Trust (${{ matrix.os }}, ${{ matrix.optimize }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        optimize: [debug, safe]
    steps:
      - uses: actions/checkout@v7
      - name: Install Zig via ghr
        uses: cataggar/ghr/actions/install@v0.9.1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tools: |
            cataggar/zig@v0.17.0 RWSGOq2NVecA2UPNdBUZykf1CCb147pkmdtYxgb3Ti+JO/wCYvhbAb/U
      - name: Synthetic metadata, ownership, and selected-signature tests
        shell: bash
        run: zig build test-tls-standard-trust -Doptimize=${{ matrix.optimize }} --summary all --cache-dir .zig-cache/trust-policy
      - name: Read-only native trust snapshot
        shell: bash
        run: zig build test-tls-system-trust -Doptimize=${{ matrix.optimize }} --summary all --cache-dir .zig-cache/trust-policy
      # No step installs certificates or modifies a keychain, trust setting,
      # registry value, or user/machine certificate store. In-memory API fixtures
      # are process-local. Unsupported platform metadata intentionally fails CI.
