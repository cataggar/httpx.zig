# Evidence branch only. These results do not qualify production trust policy.
name: Windows disallowed identity evidence

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence:
    name: Disallowed identity (${{ matrix.target }}, ${{ matrix.optimize }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            target: x86_64-windows
            architecture: X64
            optimize: Debug
          - os: windows-2025
            target: x86_64-windows
            architecture: X64
            optimize: ReleaseSafe
          - os: windows-11-vs2026-arm
            target: aarch64-windows
            architecture: Arm64
            optimize: Debug
          - os: windows-11-vs2026-arm
            target: aarch64-windows
            architecture: Arm64
            optimize: ReleaseSafe
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Require the matching native Windows host
        shell: pwsh
        run: |
          $actual = [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString()
          if ($actual -ne '${{ matrix.architecture }}') {
            throw "Expected native ${{ matrix.architecture }} host, got $actual"
          }
          Write-Output "Synthetic metadata evidence: host=$actual target=${{ matrix.target }} mode=${{ matrix.optimize }}"
      - name: Compile bounded synthetic metadata comparisons
        shell: pwsh
        run: |
          zig test src/tls/platform_trust_windows.zig --test-filter "disallowed conformance" -target "${{ matrix.target }}" -O "${{ matrix.optimize }}" -lcrypt32 --test-no-exec --cache-dir .zig-cache/disallowed-conformance "-femit-bin=.zig-cache/disallowed-evidence.exe"
          $code = $LASTEXITCODE
          Write-Output "Evidence compiler exit=$code binary_present=$(Test-Path .zig-cache/disallowed-evidence.exe)"
          if ($code -ne 0) { exit $code }
      - name: Execute the bounded native evidence binary
        shell: pwsh
        run: |
          $binary = (Resolve-Path .zig-cache/disallowed-evidence.exe).Path
          $digest = (Get-FileHash -Algorithm SHA256 $binary).Hash
          Write-Output "Native evidence execution target=${{ matrix.target }} mode=${{ matrix.optimize }} binary_sha256=$digest"
          & $binary
          $code = $LASTEXITCODE
          Write-Output "Native evidence exit=$code"
          if ($code -ne 0) { exit $code }
