name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Format check
        run: zig fmt --check src/ examples/ bench/ build.zig

  test:
    name: Test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux
          - os: macos-latest
            name: macOS
          - os: windows-latest
            name: Windows
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Cache Zig build
        uses: actions/cache@v6
        with:
          path: .zig-cache
          key: zig-${{ runner.os }}-${{ hashFiles('src/**', 'build.zig', 'build.zig.zon') }}
          restore-keys: zig-${{ runner.os }}-

      - name: Unit tests
        shell: bash
        run: zig build test --summary all --test-timeout 120s
        env:
          ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/.zig-cache
          ZIG_LOCAL_CACHE_DIR: ${{ github.workspace }}/.zig-cache

      - name: Run all examples
        shell: bash
        run: zig build run-all-examples
        env:
          ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/.zig-cache
          ZIG_LOCAL_CACHE_DIR: ${{ github.workspace }}/.zig-cache

      - name: Build (Debug)
        run: zig build -Doptimize=Debug
        env:
          ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/.zig-cache
          ZIG_LOCAL_CACHE_DIR: ${{ github.workspace }}/.zig-cache

      - name: Build (ReleaseFast)
        run: zig build -Doptimize=ReleaseFast
        env:
          ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/.zig-cache
          ZIG_LOCAL_CACHE_DIR: ${{ github.workspace }}/.zig-cache
