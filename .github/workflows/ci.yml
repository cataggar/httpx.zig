name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
          cache-key: lint

      - name: Format check
        run: zig fmt --check src/ examples/ bench/ build.zig

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux
          - os: macos-latest
            name: macOS
          - os: windows-latest
            name: Windows
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
          cache-key: test-${{ matrix.os }}

      - name: Run tests
        run: zig build test --summary all

      - name: Build (Debug)
        run: zig build -Doptimize=Debug

      - name: Build (ReleaseFast)
        run: zig build -Doptimize=ReleaseFast

  cross-build:
    name: Cross Build (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-macos
          - aarch64-macos
          - x86_64-windows
          - x86-windows
          - aarch64-linux
          - riscv64-linux
          - arm-linux-gnueabihf

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
          cache-key: cross-${{ matrix.target }}

      - name: Install cross-compilation deps
        if: contains(matrix.target, 'linux') && !startsWith(matrix.target, 'x86_64')
        run: |
          sudo apt-get update
          case "${{ matrix.target }}" in
            aarch64-linux*)
              sudo apt-get install -y qemu-user-static gcc-aarch64-linux-gnu
              ;;
            arm-linux*)
              sudo apt-get install -y qemu-user-static gcc-arm-linux-gnueabihf
              ;;
            riscv64-linux*)
              sudo apt-get install -y qemu-user-static gcc-riscv64-linux-gnu
              ;;
          esac

      - name: Build
        run: zig build -Dtarget=${{ matrix.target }} -Doptimize=Debug
