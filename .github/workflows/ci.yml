name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build & Test (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
          cache-key: build

      - name: Cache Zig build
        uses: actions/cache@v6
        with:
          path: .zig-cache
          key: zig-build-${{ runner.os }}-${{ hashFiles('src/**', 'build.zig', 'build.zig.zon') }}
          restore-keys: zig-build-${{ runner.os }}-

      - name: Run tests
        run: zig build test --summary all

      - name: Build (Debug)
        run: zig build -Doptimize=Debug

      - name: Build (ReleaseFast)
        run: zig build -Doptimize=ReleaseFast

      - name: Format check
        run: zig fmt --check src/ examples/ bench/ build.zig

  test-matrix:
    name: Test (${{ matrix.target }})
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-linux
          - os: ubuntu-latest
            target: x86-linux
            setup: sudo apt-get update && sudo apt-get install -y gcc-multilib
          - os: ubuntu-latest
            target: aarch64-linux
            setup: sudo apt-get update && sudo apt-get install -y qemu-user-static gcc-aarch64-linux-gnu
          - os: macos-latest
            target: x86_64-macos
          - os: macos-latest
            target: aarch64-macos
          - os: windows-latest
            target: x86_64-windows
          - os: windows-latest
            target: x86-windows

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
          cache-key: test-${{ matrix.target }}

      - name: Cache Zig build
        uses: actions/cache@v6
        with:
          path: .zig-cache
          key: zig-${{ matrix.target }}-${{ hashFiles('src/**', 'build.zig', 'build.zig.zon') }}
          restore-keys: zig-${{ matrix.target }}-

      - name: Install dependencies
        if: matrix.setup != ''
        run: ${{ matrix.setup }}

      - name: Test
        run: zig build test -Dtarget=${{ matrix.target }} --summary all

      - name: Run examples
        timeout-minutes: 10
        run: zig build run-all-examples -Dtarget=${{ matrix.target }}

  cross-build:
    name: Cross Build (${{ matrix.target }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-macos
          - aarch64-macos
          - x86_64-windows
          - x86-windows
          - aarch64-linux
          - riscv64-linux
          - arm-linux-gnueabihf

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
          use-cache: false

      - name: Cache Zig build
        uses: actions/cache@v6
        with:
          path: .zig-cache
          key: zig-${{ matrix.target }}-${{ hashFiles('src/**', 'build.zig', 'build.zig.zon') }}
          restore-keys: zig-${{ matrix.target }}-

      - name: Build
        run: zig build -Dtarget=${{ matrix.target }} -Doptimize=Debug
